services:
  ucpadaptor:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GOOGLE_API_KEY}
      - UCP_STORE_NAME=${UCP_STORE_NAME:-UCP Demo Store}
      - UCP_CATALOG_BACKEND=${UCP_CATALOG_BACKEND:-mock}
      - UCP_CATALOG_REST_PRODUCTS_URL=${UCP_CATALOG_REST_PRODUCTS_URL:-}
      - UCP_CATALOG_REST_AUTH_HEADER_NAME=${UCP_CATALOG_REST_AUTH_HEADER_NAME:-}
      - UCP_CATALOG_REST_AUTH_HEADER_VALUE=${UCP_CATALOG_REST_AUTH_HEADER_VALUE:-}
      - UCP_CATALOG_REST_FIELD_MAPPING_ID=${UCP_CATALOG_REST_FIELD_MAPPING_ID:-id}
      - UCP_CATALOG_REST_FIELD_MAPPING_NAME=${UCP_CATALOG_REST_FIELD_MAPPING_NAME:-name}
      - UCP_CATALOG_REST_FIELD_MAPPING_DESCRIPTION=${UCP_CATALOG_REST_FIELD_MAPPING_DESCRIPTION:-description}
      - UCP_CATALOG_REST_FIELD_MAPPING_PRICE=${UCP_CATALOG_REST_FIELD_MAPPING_PRICE:-price}
      - UCP_CATALOG_REST_FIELD_MAPPING_CURRENCY=${UCP_CATALOG_REST_FIELD_MAPPING_CURRENCY:-currency}
      - UCP_CATALOG_REST_FIELD_MAPPING_CATEGORIES=${UCP_CATALOG_REST_FIELD_MAPPING_CATEGORIES:-categories}
      - UCP_CATALOG_REST_FIELD_MAPPING_PRICE_ALREADY_MINOR_UNITS=${UCP_CATALOG_REST_FIELD_MAPPING_PRICE_ALREADY_MINOR_UNITS:-true}
      - UCP_BASE_URL=${UCP_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/.well-known/ucp"]
      interval: 10s
      retries: 5
