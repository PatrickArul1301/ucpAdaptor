<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCP Agentic Commerce Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #2c3e50; height: 100vh; display: flex; flex-direction: column; }

    header { background: #2c3e50; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    header h1 { font-size: 1.2rem; }
    header a { color: #5dade2; text-decoration: none; font-size: 0.85rem; }

    .layout { display: grid; grid-template-columns: 35% 65%; flex: 1; overflow: hidden; }

    .trace-panel { background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; border-right: 1px solid #313244; overflow: hidden; }
    .trace-panel h2 { padding: 12px 16px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #89b4fa; border-bottom: 1px solid #313244; flex-shrink: 0; }
    .trace-content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    .tool-card { background: #181825; border: 1px solid #313244; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    .tool-card-header { padding: 8px 12px; background: #313244; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .tool-card-header .icon { font-size: 0.75rem; }
    .tool-card-header .name { font-size: 0.8rem; font-weight: bold; color: #89dceb; }
    .tool-card-header .badge { font-size: 0.7rem; color: #a6e3a1; margin-left: auto; background: #1a3a1a; padding: 2px 8px; border-radius: 10px; }
    .tool-card-body { padding: 8px 12px; font-size: 0.72rem; font-family: monospace; color: #cba6f7; max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; display: none; }
    .tool-card.expanded .tool-card-body { display: block; }
    .tool-result-card { border-left: 3px solid #a6e3a1; }
    .tool-result-card .tool-card-header { background: #1e2a1e; }
    .tool-result-card .tool-card-header .name { color: #a6e3a1; }
    .tool-result-card .tool-card-header .badge { color: #89dceb; background: #1a1a3a; }

    .chat-panel { display: flex; flex-direction: column; overflow: hidden; background: #f4f6f8; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

    .bubble { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .bubble.user { align-self: flex-end; background: #2980b9; color: white; border-bottom-right-radius: 4px; }
    .bubble.assistant { align-self: flex-start; background: white; color: #2c3e50; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-bottom-left-radius: 4px; min-height: 40px; }
    .bubble.assistant.streaming::after { content: '\25AE'; animation: blink 0.8s step-start infinite; margin-left: 2px; color: #2980b9; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .starters { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid #e8ecef; background: #f8f9fa; flex-shrink: 0; }
    .chip { background: white; border: 1px solid #dee2e6; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; color: #495057; transition: background 0.15s, color 0.15s, border-color 0.15s; }
    .chip:hover { background: #2980b9; color: white; border-color: #2980b9; }

    .input-area { padding: 12px 16px; border-top: 1px solid #dee2e6; background: white; display: flex; gap: 10px; flex-shrink: 0; }
    .input-area input { flex: 1; border: 1px solid #ced4da; border-radius: 24px; padding: 10px 18px; font-size: 0.88rem; outline: none; font-family: inherit; }
    .input-area input:focus { border-color: #2980b9; box-shadow: 0 0 0 2px rgba(41,128,185,0.15); }
    .input-area button { background: #2980b9; color: white; border: none; border-radius: 24px; padding: 10px 22px; font-size: 0.88rem; cursor: pointer; font-family: inherit; }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-area button:hover:not(:disabled) { background: #1f618d; }

    .empty-trace { color: #45475a; font-size: 0.8rem; text-align: center; padding: 24px 12px; }

    /* ── UCP protocol cards (blue/indigo — distinct from tool cards) ──────── */
    .ucp-section-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #6c7086; padding: 4px 4px 2px; flex-shrink: 0; }

    .ucp-card { background: #181825; border: 1px solid #3a4a6a; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    .ucp-card-header { padding: 8px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .ucp-card-header .icon { font-size: 0.75rem; }
    .ucp-card-header .name { font-size: 0.8rem; font-weight: bold; }
    .ucp-card-header .badge { font-size: 0.7rem; margin-left: auto; padding: 2px 8px; border-radius: 10px; }
    .ucp-card-body { padding: 8px 12px; font-size: 0.72rem; font-family: monospace; max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; display: none; }
    .ucp-card.expanded .ucp-card-body { display: block; }

    .ucp-discovery-card .ucp-card-header { background: #1a2a40; }
    .ucp-discovery-card .ucp-card-header .name { color: #89b4fa; }
    .ucp-discovery-card .ucp-card-header .badge { color: #89b4fa; background: #1a2233; }
    .ucp-discovery-card { border-color: #3a5a8a; }
    .ucp-discovery-card .ucp-card-body { color: #89b4fa; }

    .ucp-intersection-card .ucp-card-header { background: #1a1a3a; }
    .ucp-intersection-card .ucp-card-header .name { color: #cba6f7; }
    .ucp-intersection-card .ucp-card-header .badge { color: #a6e3a1; background: #1a3a1a; }
    .ucp-intersection-card { border-color: #4a3a6a; }
    .ucp-intersection-card .ucp-card-body { color: #cba6f7; }

    /* capability pill list inside intersection card */
    .cap-row { display: flex; flex-direction: column; gap: 4px; padding: 6px 12px 10px; }
    .cap-group { font-size: 0.68rem; color: #6c7086; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .cap-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-family: monospace; margin: 1px 2px; }
    .cap-pill.matched { background: #1a3a1a; color: #a6e3a1; border: 1px solid #2a5a2a; }
    .cap-pill.unavailable { background: #2a1a1a; color: #f38ba8; border: 1px solid #5a2a2a; text-decoration: line-through; opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <h1>UCP Agentic Commerce Demo</h1>
    <a href="/">Back to Store</a>
  </header>
  <div class="layout">
    <div class="trace-panel">
      <h2>Tool Trace</h2>
      <div class="trace-content" id="trace">
        <div class="empty-trace">Tool calls will appear here as the AI shops for you.</div>
      </div>
    </div>
    <div class="chat-panel">
      <div class="chat-messages" id="messages"></div>
      <div class="starters">
        <span class="chip" onclick="send('Find me headphones under $150')">Find me headphones under $150</span>
        <span class="chip" onclick="send('Add it to my cart')">Add it to my cart</span>
        <span class="chip" onclick="send('What\'s in my cart?')">What's in my cart?</span>
        <span class="chip" onclick="send('Show me all sports products')">Show me all sports products</span>
      </div>
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Ask about products, add to cart..." onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendInput(); }">
        <button id="sendBtn" onclick="sendInput()">Send</button>
      </div>
    </div>
  </div>
  <script>
    // Stable for this page session; refreshing the page starts a fresh conversation.
    const conversationId = crypto.randomUUID();
    let traceEmpty = true;

    function clearEmptyTrace() {
      if (traceEmpty) {
        document.getElementById('trace').innerHTML = '';
        traceEmpty = false;
      }
    }

    function addBubble(role, text) {
      const msg = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      msg.appendChild(div);
      msg.scrollTop = msg.scrollHeight;
      return div;
    }

    function addUcpDiscoveryCard(data) {
      clearEmptyTrace();
      const trace = document.getElementById('trace');

      const label = document.createElement('div');
      label.className = 'ucp-section-label';
      label.textContent = '— UCP Protocol —';
      trace.appendChild(label);

      const card = document.createElement('div');
      card.className = 'ucp-card ucp-discovery-card';

      const caps = (data.storeCapabilities || []).length;
      const header = document.createElement('div');
      header.className = 'ucp-card-header';
      header.innerHTML = '<span class="icon">&#x1F50D;</span>'
        + '<span class="name">GET /.well-known/ucp</span>'
        + '<span class="badge">' + caps + ' capabilit' + (caps === 1 ? 'y' : 'ies') + '</span>';
      header.onclick = () => card.classList.toggle('expanded');

      const body = document.createElement('div');
      body.className = 'ucp-card-body';
      body.textContent = JSON.stringify(data, null, 2);

      card.appendChild(header);
      card.appendChild(body);
      trace.appendChild(card);
      trace.scrollTop = trace.scrollHeight;
      return card;
    }

    function addUcpIntersectionCard(data) {
      clearEmptyTrace();
      const trace = document.getElementById('trace');

      const card = document.createElement('div');
      card.className = 'ucp-card ucp-intersection-card';

      const matched = (data.intersection || []).length;
      const total = (data.agentCapabilities || []).length;
      const header = document.createElement('div');
      header.className = 'ucp-card-header';
      header.innerHTML = '<span class="icon">&#x2229;</span>'
        + '<span class="name">Capability Intersection</span>'
        + '<span class="badge">' + matched + ' / ' + total + ' matched</span>';
      header.onclick = () => card.classList.toggle('expanded');

      const capRow = document.createElement('div');
      capRow.className = 'cap-row';

      if (data.intersection && data.intersection.length > 0) {
        const g1 = document.createElement('div');
        g1.className = 'cap-group';
        g1.textContent = 'Active this session';
        capRow.appendChild(g1);
        data.intersection.forEach(function(c) {
          const pill = document.createElement('span');
          pill.className = 'cap-pill matched';
          pill.textContent = c.replace('dev.ucp.shopping.', '');
          pill.title = c;
          capRow.appendChild(pill);
        });
      }

      if (data.notAvailable && data.notAvailable.length > 0) {
        const g2 = document.createElement('div');
        g2.className = 'cap-group';
        g2.textContent = 'Not available here';
        capRow.appendChild(g2);
        data.notAvailable.forEach(function(c) {
          const pill = document.createElement('span');
          pill.className = 'cap-pill unavailable';
          pill.textContent = c.replace('dev.ucp.shopping.', '');
          pill.title = c;
          capRow.appendChild(pill);
        });
      }

      const body = document.createElement('div');
      body.className = 'ucp-card-body';
      body.textContent = JSON.stringify(data, null, 2);

      card.appendChild(header);
      card.appendChild(capRow);
      card.appendChild(body);
      trace.appendChild(card);
      trace.scrollTop = trace.scrollHeight;
      return card;
    }

    function addTraceCard(name, type, jsonData) {
      clearEmptyTrace();
      const trace = document.getElementById('trace');
      const card = document.createElement('div');
      const isResult = type === 'result';
      card.className = 'tool-card' + (isResult ? ' tool-result-card' : '');

      const icon = isResult ? '&#x2713;' : '&#x26A1;';
      const badgeText = isResult ? 'result' : 'call';

      const header = document.createElement('div');
      header.className = 'tool-card-header';
      header.innerHTML = '<span class="icon">' + icon + '</span>'
        + '<span class="name">' + escapeHtml(name) + '</span>'
        + '<span class="badge">' + badgeText + '</span>';
      header.onclick = () => card.classList.toggle('expanded');

      const body = document.createElement('div');
      body.className = 'tool-card-body';
      body.textContent = formatJson(jsonData);

      card.appendChild(header);
      card.appendChild(body);
      trace.appendChild(card);
      trace.scrollTop = trace.scrollHeight;
      return card;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatJson(data) {
      try { return JSON.stringify(JSON.parse(data), null, 2); } catch (e) { return data; }
    }

    async function send(message) {
      if (!message || !message.trim()) return;
      const btn = document.getElementById('sendBtn');
      const input = document.getElementById('msgInput');
      btn.disabled = true;
      input.disabled = true;
      input.value = '';

      addBubble('user', message);
      const assistantBubble = addBubble('assistant', '');
      assistantBubble.classList.add('streaming');
      let assistantText = '';

      try {
        const resp = await fetch('/api/demo/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, conversationId })
        });

        if (!resp.ok) {
          assistantBubble.textContent = 'Server error: ' + resp.status;
          assistantBubble.classList.remove('streaming');
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split('\n\n');
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.trim()) continue;
            let eventType = 'message';
            let dataLine = '';
            for (const line of part.split('\n')) {
              if (line.startsWith('event:')) eventType = line.slice(6).trim();
              else if (line.startsWith('data:')) dataLine = line.slice(5).trim();
            }
            console.log('[demo] SSE event:', eventType, '| data:', dataLine.slice(0, 200));
            if (!dataLine) continue;

            if (eventType === 'ucp_discovery') {
              try {
                const obj = JSON.parse(dataLine);
                addUcpDiscoveryCard(obj);
              } catch (e) { console.error('[demo] ucp_discovery parse error:', e); }
            } else if (eventType === 'ucp_intersection') {
              try {
                const obj = JSON.parse(dataLine);
                addUcpIntersectionCard(obj);
              } catch (e) { console.error('[demo] ucp_intersection parse error:', e); }
            } else if (eventType === 'text') {
              try {
                const obj = JSON.parse(dataLine);
                console.log('[demo] text chunk:', obj.chunk);
                assistantText += obj.chunk || '';
                assistantBubble.textContent = assistantText;
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
              } catch (e) { console.error('[demo] text parse error:', e, dataLine); }
            } else if (eventType === 'tool_use') {
              try {
                const obj = JSON.parse(dataLine);
                addTraceCard(obj.name, 'use', JSON.stringify(obj.arguments));
              } catch (e) { console.error('[demo] tool_use parse error:', e); }
            } else if (eventType === 'tool_result') {
              try {
                const obj = JSON.parse(dataLine);
                addTraceCard(obj.name, 'result', JSON.stringify(obj.result));
              } catch (e) { console.error('[demo] tool_result parse error:', e); }
            } else if (eventType === 'done') {
              console.log('[demo] done event received');
              assistantBubble.classList.remove('streaming');
            }
          }
        }
        console.log('[demo] stream reader exhausted');
      } catch (e) {
        console.error('[demo] stream error:', e);
        assistantBubble.textContent = 'Connection error: ' + e.message;
      } finally {
        assistantBubble.classList.remove('streaming');
        btn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function sendInput() {
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();
      if (msg) send(msg);
    }
  </script>
</body>
</html>
