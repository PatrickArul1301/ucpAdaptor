spring.application.name=UCPAdaptor

# Expose Spring AI MCP server at the UCP-registered path
spring.ai.mcp.server.name=ucpadaptor
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/ucp/mcp
spring.ai.mcp.server.streamable-http.session-management=STATELESS