spring.application.name=UCPAdaptor

# Expose Spring AI MCP server at the UCP-registered path
spring.ai.mcp.server.name=ucpadaptor
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/ucp/mcp

# Public-facing base URL used in /.well-known/ucp discovery response.
# Override this when deployed (e.g. PUBLIC_URL=https://ucpadaptor.onrender.com).
# Defaults to localhost for local development.
ucp.public-url=http://localhost:8080