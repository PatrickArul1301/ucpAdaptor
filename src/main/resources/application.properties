spring.application.name=UCPAdaptor

# MCP Server
spring.ai.mcp.server.name=ucpadaptor
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/ucp/mcp

# UCP Store Identity
ucp.store-name=UCP Demo Store
# ucp.base-url=                        # blank = auto-detect from request Host

# Catalog Backend
ucp.catalog.backend=mock

# REST adapter template (uncomment and fill when backend=rest):
# ucp.catalog.rest.products-url=https://api.myclient.com/products
# ucp.catalog.rest.auth-header-name=Authorization
# ucp.catalog.rest.auth-header-value=Bearer your-token
# ucp.catalog.rest.field-mapping.id=id
# ucp.catalog.rest.field-mapping.name=name
# ucp.catalog.rest.field-mapping.description=description
# ucp.catalog.rest.field-mapping.price=price
# ucp.catalog.rest.field-mapping.currency=currency
# ucp.catalog.rest.field-mapping.categories=categories
# ucp.catalog.rest.field-mapping.price-already-minor-units=true

# JWK (override to use your own signing key)
ucp.jwk-kid=ucpadaptor-key-2026
ucp.jwk-kty=EC
ucp.jwk-crv=P-256
ucp.jwk-x=08dxr3fmRRgHgI5AuNfAzgdLLKxs5_V6LssqemQkSHA
ucp.jwk-y=Jg4OMbHECBZF0EaL6lWO8Q4zudRj2lYm6JShabSDaq8
ucp.jwk-use=sig
ucp.jwk-alg=ES256

# Google Gemini (for /demo chat UI - requires GOOGLE_API_KEY env var)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.max-output-tokens=4096
